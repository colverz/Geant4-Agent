<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geant4 Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <span class="logo">G4</span>
    <span class="title">Geant4 Agent</span>
    <span class="spacer"></span>
    <span id="session-pill" class="pill">session</span>
    <span id="adapter-pill" class="pill dim">adapter</span>
    <span id="phase-pill" class="pill accent">idle</span>
    <button id="reset-btn" class="btn-icon" title="Reset">&#8635;</button>
    <span class="desktop-only" id="window-controls">
      <button id="window-min-btn" class="btn-icon" title="Minimize">&minus;</button>
      <button id="window-max-btn" class="btn-icon" title="Maximize">&#9744;</button>
      <button id="window-close-btn" class="btn-icon" title="Close">&times;</button>
    </span>
  </header>

  <main class="chat" id="timeline">
    <div class="welcome">
      <h2>Geant4 Agent</h2>
      <p>描述你的物理模拟目标，我会设计方案、生成配置并在确认后运行 Geant4。</p>
      <div class="quick-actions">
        <button class="quick-btn" data-text="评估 1 MeV gamma 穿过 10mm 铅板的透射效果">Gamma 铅屏蔽透射</button>
        <button class="quick-btn" data-text="质子束打入水模体的深度剂量分布">质子深度剂量</button>
        <button class="quick-btn" data-text="宇航员在太空中受到的质子辐射">宇航员太空辐照</button>
        <button class="quick-btn" data-text="铝块内部空洞 NDT 无损检测">NDT 缺陷检测</button>
      </div>
    </div>
  </main>

  <footer class="composer-area">
    <div class="composer">
      <textarea id="prompt-input" rows="1" placeholder="输入模拟目标..."></textarea>
      <div class="composer-row">
        <select id="lang-select" class="field-sm">
          <option value="zh" selected>中文</option>
          <option value="en">English</option>
        </select>
        <select id="model-config-select" class="field-sm"></select>
        <input id="events-input" type="number" value="1000" min="1" max="1000000" class="field-sm" style="width:80px" title="Events">
        <span class="spacer"></span>
        <button id="send-btn" class="btn-primary">Send</button>
      </div>
    </div>
    <div id="activity-strip" class="activity-strip" hidden></div>
  </footer>

  <!-- trace panel (slide-over) -->
  <aside id="trace-panel" class="slide-panel" hidden>
    <div class="panel-head">
      <span>Reasoning Chain</span>
      <button class="btn-icon" onclick="$('trace-panel').hidden=true">&times;</button>
    </div>
    <div class="panel-body" id="trace-content"></div>
  </aside>
</div>
<script>window.onerror=function(m,u,l,c,e){var d=new Date().toISOString();var msg='['+d+'] ERROR: '+m+' (line '+l+')';if(e&&e.stack)msg+='\n'+e.stack;fetch('/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:'error',message:msg})}).catch(function(){})};window.addEventListener('unhandledrejection',function(e){var d=new Date().toISOString();var msg='['+d+'] PROMISE: '+(e.reason?.message||e.reason||'?');fetch('/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:'error',message:msg})}).catch(function(){})})</script>
<script src="app.js"></script>
</body>
</html>
